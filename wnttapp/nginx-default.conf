
server {

    server_name tides.wellsreserve.org;
    root /etc/nginx/html;

    listen [::]:443 ssl ipv6only=on; 
    listen 443 ssl; 

    ssl_certificate /cert/live/tides.wellsreserve.org/fullchain.pem;
    ssl_certificate_key /cert/live/tides.wellsreserve.org/privkey.pem;

    # Bot/scanner probes for paths this app doesn't serve (credential dumps, .env files,
    # CMS/plugin exploits, generic API recon, etc). Drop them quietly instead of logging a 404
    # for every scan or letting them reach the static file lookup. Repeated groups are collapsed
    # into single terms rather than enumerated.
    location ~* "\.env|^/v\d+(\.\d+)?(/|$)|^/node/|aws|credentials|sendgrid|stripe|phpinfo|(common|config|constants?|server)\.(js|json|php)$|^/auth(/|$)|^/sonicos/|^/system(/|$)|^/(address|graph|latest|stations)/|^/settings(\.py)?$|^/swagger(\.json)?$|^/exec(ute)?$|^/users?$|^/\.bak$|^/\.conf$|^/\.git/config$|^/\.js$|^/\.json$|^/\.old$|^/\.php$|^/\.txt$|^/\.yaml$|^/\.yml$|^/account$|^/config$|^/dashboard$|^/documentation$|^/download$|^/env$|^/env\.js$|^/fetch$|^/geojson$|^/gql$|^/graphql$|^/health$|^/hello$|^/http/routers$|^/index\.php/v1/config/application$|^/info\.php$|^/json$|^/keys\.json$|^/login$|^/mcp$|^/openapi\.json$|^/overview$|^/ping$|^/projects/search$|^/proxy$|^/query$|^/redirect$|^/register$|^/request$|^/rest$|^/run$|^/s3$|^/session/properties$|^/status$|^/test$|^/url$|^/version$|^/webhook$" {
        access_log off;
        return 444;
    }

    location /api/ {
        # https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_set_header
        # for "proxy_set_header Host", here are 4 possibilities:
        # 1. $host -- same as $http_host, or primary server name if $http_host not present
        #    For us, this yields the static IP of the server
        # 2. $http_host -- pass it as is. For us, it sends the static IP of the server.
        # 3. $proxy_host -- default, the "proxied server as specified in proxy_pass", in our case "api-c:8001"
        # 4. Leave it out. uses the default $proxy_host
        proxy_pass http://api-c:8001/;
    }
}

server {
    if ($host = tides.wellsreserve.org) {
        return 301 https://$host$request_uri;
    } 

    listen 80;
    listen [::]:80;
    server_name tides.wellsreserve.org;
    return 404;
}