name: wntt

services:
    app:
        container_name: app-c
        image: wnttapp:arm
        # Images are built locally (mytools/buildapp); never try to pull from a registry.
        # Works around Docker Desktop's containerd image store intermittently failing to
        # resolve locally-built tags, which makes compose fall back to a (doomed) pull.
        pull_policy: never
        ports:
            # Must be identical for dev, else importing local images fails - vite bug?
            - 3001:3001
        restart: unless-stopped
        volumes:
            # For Hot Module Replacement (hmr), mount the src code.
            # Path is relative to the location of this yml file
            - ../wnttapp/src:/app/src

    api:
        container_name: api-c
        image: wnttapi:arm
        pull_policy: never
        environment:
            DJANGO_SETTINGS_MODULE: project.settings.dev
            SECRET_KEY: ${DJANGO_KEY}
            CDMO_USER: ${CDMO_USER}
            CDMO_PASSWORD: ${CDMO_PASSWORD}
            GEOCODE_KEY: ${GEOCODE_KEY}
            CDMO_LOG_LEVEL: ${CDMO_LOG_LEVEL-INFO}
            FORCE_API_CDMO: ${FORCE_API_CDMO-0}
            FORCE_API_ASTRO: ${FORCE_API_ASTRO-0}
            # Supports debugging:
            DEBUGPY_ENABLE: 0
            APP_BANNER: ${APP_BANNER-}
        ports:
            - 8000:8001
            # Supports debugging:
            - 5678:5678
        restart: unless-stopped
        volumes:
            # Path is relative to the location of this yml file
            - ../datamount:/data
